version=1

# Fast deterministic workload used for local integration and CI checks.
[workload.smoke_structured]
profile=smoke
input=synthetic:structured
input_checksum=4512809272055848063
rows=48
columns=48
repetitions=2
suites=all
casf_quantiles=0.10,0.50,0.90
attribute_bundle.radiometric_size=AREA,MEAN_GRAY_LEVEL,VOLUME,GRAY_LEVEL_HEIGHT
attribute_bundle.shape_boundary=group:BOUNDARY,AREA,BOX_WIDTH,BOUNDING_BOX_HEIGHT,MAX_DIST

# Routine scientific workload. Repetitions and suites may be overridden; changing
# dimensions intentionally invalidates the pinned input checksum.
[workload.core_structured]
profile=core
