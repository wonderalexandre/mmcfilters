[build-system]
requires = [
  "scikit-build-core>=1.0",
  "setuptools-scm>=8",
  "pybind11>=3.0.1",
]
build-backend = "scikit_build_core.build"

[project]
dynamic = ["version"]
name = "mmcfilters"
description = "Library for connected image filtering based on morphological trees"
readme = "README.md"
authors = [{ name = "Wonder Alexandre Luz Alves", email = "wonderalexandre@gmail.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
]
keywords = ["morphological trees", "mathematical morphology", "image processing", "computer vision"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
notebooks = [
  "bokeh>=3.3",
  "higra>=0.6.12",
  "ipython>=8.12",
  "jupyterlab>=4.0",
  "matplotlib>=3.7",
  "morphotreeviz",
  "nbclient>=0.10",
  "nbconvert>=7.10",
  "nbformat>=5.10",
  "opencv-python-headless>=4.8",
  "pandas>=2.0",
  "scikit-image>=0.21",
  "scipy>=1.10",
]

[tool.setuptools_scm]
# Write the tag-derived version into the Python package during builds.
write_to = "python/mmcfilters/_version.py"
version_scheme = "post-release"
local_scheme = "no-local-version"
tag_regex = "^v?(?P<version>\\d+\\.\\d+\\.\\d+(?:[.-].*)?)$"

[tool.scikit-build]
wheel.packages = ["python/mmcfilters"]

[tool.scikit-build.cmake]
build-type = "Release"
args = [
  "-DMMCFILTERS_BUILD_PYTHON=ON",
  "-DMMCFILTERS_BUILD_TESTS=OFF",
  "-DMMC_PYBINDS_DIR=pybinds",
]

[tool.scikit-build.cmake.define]
CMAKE_OSX_DEPLOYMENT_TARGET = "11.0"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.scikit-build.sdist]
inclusion-mode = "explicit"
include = [
  "/python/**",
  "/pybinds/**",
  "/mmcfilters/**",
  "/cmake/**",
  "/docs/**",
  "/examples/**",
  "/external/stb/**",
  "/CHANGELOG.md",
  "/CMakeLists.txt",
  "/pyproject.toml",
  "/pybind11.cmake",
  "/LICENSE",
  "/README.md",
]
exclude = [
  "/.github/**",
  "/.gitignore",
  "/.pytest_cache/**",
  "/.vscode/**",
  "/build/**",
  "/dat/**",
  "/dist/**",
  "/notebooks/**",
  "/docs/benchmarks/**",
  "/python/mmcfilters/__pycache__/**",
  "/python/mmcfilters/**/*.py[cod]",
  "**/.ipynb_checkpoints/**",
  "**/__pycache__/**",
  "**/*.py[cod]",
]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-manylinux_i686 *-musllinux_*"
test-requires = ["numpy"]
test-command = "python -c \"import mmcfilters, numpy as np; image = np.array([[1, 2], [3, 4]], dtype=np.uint8); tree = mmcfilters.MorphologicalTreeFactory.createMaxTree(image); names, attrs = mmcfilters.Attribute.computeAttributes(tree, [mmcfilters.Attribute.ALL]); assert tree.reconstructionImage().shape == image.shape; assert 'CONTOUR_PIXELS' in names and 'CONTOUR_SIDE_SOUTH' in names; assert attrs.shape[1] == len(names)\""
build-verbosity = 1
