name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 0"
  workflow_dispatch:
    inputs:
      notebook_profile:
        description: Notebook execution profile
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_NO_CACHE_DIR: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-promotion:
    name: Repository promotion tests
    # Only the App-created, content-free return PR can skip validation.
    if: &run_full_validation >-
      github.event_name != 'pull_request' ||
      github.repository != 'wonderalexandre/mmcfilters-dev' ||
      github.event.pull_request.base.ref != 'main' ||
      github.event.pull_request.head.ref != 'sync/public-main' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.user.login != 'mmcfilters-repository-promotion[bot]' ||
      toJSON(github.event.pull_request.changed_files) != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install workflow test dependencies
        run: python -m pip install "PyYAML>=6,<7"

      - name: Test workflow policy, publication and synchronization
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

  cmake:
    name: CMake (${{ matrix.os }})
    if: *run_full_validation
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cmake>=3.20" ninja numpy

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DMMCFILTERS_BUILD_PYTHON=ON
          -DMMCFILTERS_BUILD_TESTS=ON
          -DMMCFILTERS_BUILD_EXAMPLES=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  python-matrix:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    if: *run_full_validation
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-latest
        python-version:
          - "3.9"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cmake>=3.20" ninja numpy

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DMMCFILTERS_BUILD_PYTHON=ON
          -DMMCFILTERS_BUILD_TESTS=ON
          -DMMCFILTERS_BUILD_EXAMPLES=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  cpp-only:
    name: C++ Only (${{ matrix.os }})
    if: *run_full_validation
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cmake>=3.20" ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DMMCFILTERS_BUILD_PYTHON=OFF
          -DMMCFILTERS_BUILD_TESTS=ON
          -DMMCFILTERS_BUILD_EXAMPLES=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  scientific-benchmark-smoke:
    name: Scientific benchmark smoke (CHECKED/UNCHECKED)
    if: *run_full_validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cmake>=3.20" ninja

      - name: Configure CHECKED
        run: >
          cmake -S . -B build-benchmark-checked -G Ninja
          -DMMCFILTERS_BUILD_PYTHON=OFF
          -DMMCFILTERS_BUILD_TESTS=ON
          -DMMCFILTERS_BUILD_EXAMPLES=OFF
          -DMMCFILTERS_BUILD_BENCHMARKS=ON
          -DMMCFILTERS_CONTRACT_MODE=CHECKED
          -DCMAKE_BUILD_TYPE=Release

      - name: Configure UNCHECKED
        run: >
          cmake -S . -B build-benchmark-unchecked -G Ninja
          -DMMCFILTERS_BUILD_PYTHON=OFF
          -DMMCFILTERS_BUILD_TESTS=ON
          -DMMCFILTERS_BUILD_EXAMPLES=OFF
          -DMMCFILTERS_BUILD_BENCHMARKS=ON
          -DMMCFILTERS_CONTRACT_MODE=UNCHECKED
          -DCMAKE_BUILD_TYPE=Release

      - name: Build both contract modes
        run: |
          cmake --build build-benchmark-checked --target mmcfilters_api_benchmark --parallel
          cmake --build build-benchmark-unchecked --target mmcfilters_api_benchmark --parallel

      - name: Run manifest smoke in both modes
        run: |
          ctest --test-dir build-benchmark-checked -R '^benchmark_(api_manifest|distance_transform_contract)_smoke$' --output-on-failure
          ctest --test-dir build-benchmark-unchecked -R '^benchmark_(api_manifest|distance_transform_contract)_smoke$' --output-on-failure

      - name: Verify deterministic cross-mode results
        run: >
          python benchmarks/compare_validation_modes.py
          --process-runs 2
          --capture-samples
          build-benchmark-checked/benchmarks/mmcfilters_api_benchmark
          build-benchmark-unchecked/benchmarks/mmcfilters_api_benchmark
          --
          --manifest benchmarks/workloads/scientific-api.ini
          --workload smoke_structured
          --repetitions 1
          --suite attributes,casf

      - name: Verify distance-transform cross-mode results
        run: >
          python benchmarks/compare_validation_modes.py
          --process-runs 2
          --capture-samples
          build-benchmark-checked/benchmarks/mmcfilters_api_benchmark
          build-benchmark-unchecked/benchmarks/mmcfilters_api_benchmark
          --
          --manifest benchmarks/workloads/distance-transform-contract.ini
          --workload distance_transform_contract
          --repetitions 1
          --suite attributes

  sanitizers:
    name: Sanitizers (ubuntu-latest)
    if: *run_full_validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cmake>=3.20" ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DMMCFILTERS_BUILD_PYTHON=OFF
          -DMMCFILTERS_BUILD_TESTS=ON
          -DMMCFILTERS_BUILD_EXAMPLES=OFF
          -DMMCFILTERS_ENABLE_ASSERTS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  notebooks:
    name: Notebooks (${{ github.event_name == 'workflow_dispatch' && inputs.notebook_profile || 'full' }})
    if: *run_full_validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cmake>=3.20" ninja
          python -m pip install -e .
          python -m pip install -r notebooks/requirements.txt

      - name: Validate notebook policy
        run: python scripts/validate_notebooks.py

      - name: Execute smoke notebooks
        if: github.event_name == 'workflow_dispatch' && inputs.notebook_profile == 'smoke'
        run: python scripts/execute_notebooks.py --profile smoke

      - name: Execute full notebook suite
        if: github.event_name != 'workflow_dispatch' || inputs.notebook_profile == 'full'
        run: python scripts/execute_notebooks.py --profile full

  ci-result:
    name: CI result
    needs:
      - repository-promotion
      - cmake
      - python-matrix
      - cpp-only
      - scientific-benchmark-smoke
      - sanitizers
      - notebooks
    # Run after failed/cancelled dependencies, but use no runner for an empty sync.
    if: >-
      always() && (
        github.event_name != 'pull_request' ||
        github.repository != 'wonderalexandre/mmcfilters-dev' ||
        github.event.pull_request.base.ref != 'main' ||
        github.event.pull_request.head.ref != 'sync/public-main' ||
        github.event.pull_request.head.repo.full_name != github.repository ||
        github.event.pull_request.user.login != 'mmcfilters-repository-promotion[bot]' ||
        toJSON(github.event.pull_request.changed_files) != '0'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os

          jobs = json.loads(os.environ["CI_NEEDS"])
          if not jobs or any(job["result"] != "success" for job in jobs.values()):
              raise SystemExit(f"Required CI jobs did not all succeed: {jobs}")
          print("All required CI jobs succeeded.")
          PYTHON
